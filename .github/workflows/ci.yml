name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Reproducible install from the committed lockfile. `--locked` fails the
      # build if uv.lock drifts from pyproject.toml, so the lock cannot go stale.
      - name: Install dependencies (uv, locked)
        run: uv sync --locked --all-extras

      - name: Lint JavaScript (syntax check)
        run: |
          $failed = $false
          Get-ChildItem screenmind/api/static/js/*.js | ForEach-Object {
            Write-Host "Checking $($_.Name)..."
            node --check $_.FullName 2>&1
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      # flake8/flake8-print are not project dependencies, so they are not in
      # uv.lock; run them ephemerally on top of the locked environment.
      - name: Lint — no bare print() in source
        run: |
          uvx --with flake8-print flake8 --select=T201 --exclude=.venv,tests/,screenmind/ui/overlay.py,screenmind/setup_llama.py,screenmind/setup_wizard.py .

      - name: Run tests with coverage
        run: |
          uv run --all-extras pytest --cov=screenmind --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
